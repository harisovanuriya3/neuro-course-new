name: Module 1 medical textbook review
on:
  push:
    branches:
      - review/medical-textbook-comprehensive-1-25
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-module-one:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify module 1 trilingual content and clinical cases
        run: node scripts/check-module1-completeness.cjs
      - name: Verify module 2 content and media
        run: node scripts/check-module2-completeness.cjs
      - name: Verify module 3 theory and assessment
        run: node scripts/check-module3-completeness.cjs
      - name: Run complete scientific and course audit
        run: npm run audit:course
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Build production site
        run: npm run build
